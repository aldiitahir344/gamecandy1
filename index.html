<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CANDY MATCH EDU V</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --primary: #4fc3f7; --secondary: #81c784; }
        body { font-family: 'Baloo 2', cursive; background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100dvh; margin: 0; overflow: hidden; }
        #app-container { width: 100%; max-width: 450px; height: 100dvh; background: #f8fafc; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.3); }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; z-index: 10; padding: 20px; }
        .screen.active { display: flex; }
        .btn-custom { background: white; border-radius: 1rem; padding: 1rem; font-weight: 800; text-align: center; box-shadow: 0 4px 0 #e2e8f0; border: 2px solid #e2e8f0; transition: all 0.2s; cursor: pointer; }
        .btn-custom:active { transform: translateY(4px); box-shadow: 0 0 0 #e2e8f0; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.5); }
    </style>
</head>
<body>

<div id="app-container">
    <section id="screen-loading" class="screen active justify-center items-center">
        <div class="text-6xl animate-bounce">🍬</div>
        <h1 class="text-2xl font-bold text-blue-600 mt-4">MEMUAT DATA...</h1>
    </section>

    <!-- Menu Utama -->
    <section id="screen-menu" class="screen justify-center items-center gap-4">
        <h1 class="text-4xl font-extrabold text-blue-500 mb-8 text-center">CANDY MATCH<br>EDU V</h1>
        <button class="btn-custom w-full" onclick="showScreen('screen-identity')">▶ MULAI</button>
        <button class="btn-custom w-full" onclick="showLeaderboard()">🏆 NILAI KELAS</button>
        <button class="btn-custom w-full bg-purple-100" onclick="showScreen('screen-teacher-login')">👩‍🏫 AKSES GURU</button>
    </section>

    <!-- Identitas -->
    <section id="screen-identity" class="screen justify-center gap-4">
        <h2 class="text-xl font-bold text-center">IDENTITAS</h2>
        <input type="text" id="input-name" placeholder="Nama Lengkap" class="w-full p-4 rounded-xl border-2 border-blue-200">
        <input type="number" id="input-absen" placeholder="No Absen" class="w-full p-4 rounded-xl border-2 border-blue-200">
        <button class="btn-custom w-full bg-blue-500 text-white" onclick="startGame()">MASUK</button>
        <button class="text-sm text-gray-500" onclick="showScreen('screen-menu')">Kembali</button>
    </section>

    <!-- Hasil / End Game -->
    <section id="screen-result" class="screen justify-center items-center gap-4">
        <h2 class="text-3xl font-bold">SELESAI!</h2>
        <div class="glass p-6 w-full text-center">
            <p class="text-lg">Skor Anda: <span id="final-score" class="text-4xl font-bold text-blue-600">0</span></p>
        </div>
        <button id="btn-submit" class="btn-custom w-full bg-green-500 text-white" onclick="submitScore()">KIRIM NILAI KE GURU</button>
        <button class="btn-custom w-full" onclick="showScreen('screen-menu')">MENU UTAMA</button>
    </section>

    <!-- Leaderboard -->
    <section id="screen-leaderboard" class="screen overflow-y-auto">
        <h2 class="text-2xl font-bold mb-4">DAFTAR NILAI</h2>
        <div id="leaderboard-list" class="flex flex-col gap-2 w-full"></div>
        <button class="btn-custom w-full mt-4" onclick="showScreen('screen-menu')">KEMBALI</button>
    </section>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = "candy-match-edu-v-2026"; 
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

    let db, scoresCollection;
    let currentScore = 0;
    let currentUser = { name: '', absen: '' };

    window.onload = async () => {
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            const auth = getAuth(app);
            await signInAnonymously(auth);
            scoresCollection = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
            window.showScreen('screen-menu');
        } catch (e) {
            console.error(e);
        }
    };

    window.startGame = () => {
        currentUser.name = document.getElementById('input-name').value;
        currentUser.absen = document.getElementById('input-absen').value;
        if(!currentUser.name) return;
        // Simulasi game
        currentScore = Math.floor(Math.random() * 500) + 500;
        document.getElementById('final-score').innerText = currentScore;
        window.showScreen('screen-result');
        document.getElementById('btn-submit').disabled = false;
        document.getElementById('btn-submit').innerText = "KIRIM NILAI KE GURU";
    };

    window.submitScore = async () => {
        const btn = document.getElementById('btn-submit');
        btn.innerText = "MENGIRIM...";
        try {
            await addDoc(scoresCollection, {
                name: currentUser.name,
                absen: currentUser.absen,
                score: currentScore,
                timestamp: Date.now()
            });
            btn.innerText = "TERKIRIM!";
            btn.disabled = true;
        } catch(e) {
            btn.innerText = "GAGAL, COBA LAGI";
        }
    };

    window.showLeaderboard = () => {
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = "Memuat...";
        window.showScreen('screen-leaderboard');
        
        onSnapshot(query(scoresCollection, orderBy('score', 'desc')), (snapshot) => {
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                list.innerHTML += `<div class="glass p-3 flex justify-between">
                    <span>${data.name} (Absen ${data.absen})</span>
                    <span class="font-bold text-blue-600">${data.score}</span>
                </div>`;
            });
        });
    };

    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };
</script>
</body>
</html>
